[pytest]
# One command runs everything:   pytest
#
# The suite is in three layers, and which one fails tells you what kind of
# change you just made:
#
#   contract  the shape of the code — a class, method, widget or signal the
#             rest of the program relies on. A failure here means you removed
#             or renamed something other code (or the tests) still expects.
#             Rename freely, but rename it here too: this file IS the list of
#             names that are meant to be stable.
#
#   (default) behaviour — what the program does. Most of the suite. A failure
#             means a feature stopped working, which is almost never what you
#             wanted.
#
#   golden    exact numbers: masks, metrics and the CSV for a fixed dataset.
#             A failure means an output moved. If you meant it, look at the
#             diff, agree with it, then re-record with:
#                 pytest --update-goldens
#
# Useful subsets:
#   pytest -m contract          just the API surface (fast)
#   pytest -m "not golden"      while you are deliberately changing numbers
#   pytest -m "not slow"        skip the SAM2 workflow tests
#   pytest tests/unit           the Qt-free half
# Coverage is measured on every full run and the floor is enforced. Running a
# subset (`-m contract`, one file) naturally covers less, so add --no-cov to
# those: `pytest -m contract --no-cov`.
#
# Two files always look worse than they are. sam_worker.py runs its jobs inside
# a QThread, which coverage.py cannot trace (the thread is created in C++, so
# threading.settrace never sees it) — those job bodies ARE exercised, by
# tests/gui/test_sam_workflow.py. sam2_backend.py needs torch and a multi-GB
# checkpoint for the rest; the stub backend covers the same protocol instead.
testpaths = tests
addopts =
    -q
    --strict-markers
    --cov=wormscope
    --cov-report=term-missing:skip-covered
    --cov-fail-under=85

markers =
    contract: the public API surface — names and signatures other code depends on
    golden: exact recorded output; re-record with --update-goldens
    slow: heavier end-to-end runs (SAM2 workflow against a stub backend)
    needs_original: needs wormscope_gui3.py, the pre-refactor single file

filterwarnings =
    ignore::DeprecationWarning
